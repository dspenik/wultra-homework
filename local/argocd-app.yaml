# Local variant of gitops/apps/powerauth-test-server.yaml: tracks a branch and uses kind values.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: powerauth-test-server
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/dspenik/wultra-homework.git
    targetRevision: feat/initial-setup
    path: gitops/charts/powerauth-test-server
    helm:
      valueFiles:
        - ../../../local/values-kind.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: powerauth
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: restricted
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
