apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: powerauth-test-server
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/dspenik/wultra-homework.git
    targetRevision: main
    path: gitops/charts/powerauth-test-server
    helm:
      # Environment values; the Azure part is generated by scripts/gitops-values.sh
      valuesObject:
        image:
          tag: "2.2.0"
        migration:
          image:
            tag: "2.2.0"
        database:
          host: ""
        secrets:
          source: keyvault
          keyvault:
            name: ""
            tenantId: ""
            clientId: ""
        service:
          loadBalancerSourceRanges: []
  destination:
    server: https://kubernetes.default.svc
    namespace: powerauth
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: restricted
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
