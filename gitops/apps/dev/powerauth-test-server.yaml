apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: powerauth-test-server
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/dspenik/wultra-homework.git
    targetRevision: master
    path: gitops/charts/powerauth-test-server
    helm:
      # Environment values; the Azure part is generated by scripts/gitops-values.sh
      valuesObject:
        image:
          tag: "2.2.0"
        migration:
          image:
            tag: "2.2.0"
        database:
          host: "psql-powerauth-dev-j45v8.postgres.database.azure.com"
          name: powerauth
        secrets:
          source: keyvault
          keyvault:
            name: "kv-powerauth-dev-j45v8"
            tenantId: "d09d02bc-ce09-478b-901f-d6fe94c7b3be"
            clientId: "c335d0cd-4935-4575-8036-82c36e1a54d6"
        service:
          loadBalancerSourceRanges:
            - 185.224.112.0/24
  destination:
    server: https://kubernetes.default.svc
    namespace: powerauth
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: restricted
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
