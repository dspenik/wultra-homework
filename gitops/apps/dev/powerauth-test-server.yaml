apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: powerauth-test-server
  namespace: argocd
  # Deleting the Application also deletes the resources it deployed
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/dspenik/wultra-homework.git
    targetRevision: master
    path: gitops/charts/powerauth-test-server
    helm:
      # Environment values; the Azure part is generated by scripts/gitops-values.sh
      valuesObject:
        image:
          tag: "2.2.0"
        database:
          host: "psql-powerauth-dev-n6u7b.postgres.database.azure.com"
          name: powerauth
        secrets:
          keyvault:
            name: "kv-powerauth-dev-n6u7b"
            tenantId: "d09d02bc-ce09-478b-901f-d6fe94c7b3be"
            clientId: "9439c0c2-7558-4e44-8582-69c227fdb18b"
        service:
          loadBalancerSourceRanges:
            - 185.224.112.75/32
  destination:
    server: https://kubernetes.default.svc
    namespace: powerauth
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: restricted
    retry:
      limit: 5
      # Retry with the latest commit, not the one the sync started with
      refresh: true
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
