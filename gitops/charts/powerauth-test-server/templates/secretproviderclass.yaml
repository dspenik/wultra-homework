{{- $kv := .Values.secrets.keyvault }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "pts.fullname" . }}
  labels:
    {{- include "pts.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  provider: azure
  secretObjects:
    - secretName: {{ include "pts.secretName" . }}
      type: Opaque
      data:
        - objectName: {{ $kv.usernameObject }}
          key: username
        - objectName: {{ $kv.passwordObject }}
          key: password
  parameters:
    usePodIdentity: "false"
    clientID: {{ required "secrets.keyvault.clientId is required" $kv.clientId | quote }}
    keyvaultName: {{ required "secrets.keyvault.name is required" $kv.name | quote }}
    tenantId: {{ required "secrets.keyvault.tenantId is required" $kv.tenantId | quote }}
    objects: |
      array:
        - |
          objectName: {{ $kv.usernameObject }}
          objectType: secret
        - |
          objectName: {{ $kv.passwordObject }}
          objectType: secret
